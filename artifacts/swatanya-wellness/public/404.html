<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Swatanya Wellness</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Encode the path into a query param and redirect to index.html
    var repo = '/Elder-Care-Connect';
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      repo + '/?p=' + encodeURIComponent(l.pathname.slice(repo.length) + l.search) +
      (l.hash ? '&h=' + encodeURIComponent(l.hash.slice(1)) : '')
    );
  </script>
</head>
<body></body>
</html>
