kind = "web"
previewPath = "/"
title = "Swatanya Wellness"
version = "1.0.0"
id = "artifacts/swatanya-wellness"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18998

[services.development]
run = "pnpm --filter @workspace/swatanya-wellness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swatanya-wellness", "run", "build" ]
publicDir = "artifacts/swatanya-wellness/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18998"
BASE_PATH = "/"
